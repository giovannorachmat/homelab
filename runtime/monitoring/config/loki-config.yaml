# Based on the grafana/loki:3.6.3 stock local-config.yaml, with persistence
# (path_prefix -> /loki/data, backed by the loki-storage named volume) and
# 30-day retention added. Regenerate from the image if the major version bumps.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki/data
  storage:
    filesystem:
      chunks_directory: /loki/data/chunks
      rules_directory: /loki/data/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h

table_manager:
  retention_deletes_enabled: true
  retention_period: 720h

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
