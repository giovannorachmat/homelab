services:
  9router:
    container_name: 9router
    image: decolua/9router:latest
    restart: unless-stopped

    env_file:
      - ../../runtime/9router/.env

    ports:
      - "20128:20128"

    volumes:
      - ../../runtime/9router/data/:/app/data

    networks:
      - private-net

    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 500M
        reservations:
          cpus: "0.75"
          memory: 500M

  headroom:
    container_name: headroom
    image: ghcr.io/headroomlabs-ai/headroom:0.37.0
    restart: always

    environment:
      # ponytail: ONNX sizes its thread pool from host cores (8) and spin-waits inside the 0.5-CPU cgroup (upstream #2885/#1326); cap to 1 until upstream reads the cpuset
      ORT_INTRA_OP_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    ports:
      - "8787:8787"

    volumes:
      - ../../runtime/headroom/data:/app/data

    networks:
      - private-net

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  private-net:
    external: true
