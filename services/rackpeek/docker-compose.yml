services:
  rackpeek:
    container_name: rackpeek
    image: aptacode/rackpeek:latest
    restart: unless-stopped
    user: "1000:1000"

    ports:
      - 8082:8080

    volumes:
      - ../../runtime/rackpeek/rackpeek-config:/app/config
      - ../../runtime/rackpeek/tmp:/app/tmp

    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/health]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    networks:
      - private-net

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  private-net:
    external: true
