networks:
  monitoring:
    external: true
  private-net:
    external: true

services:
  node-exporter:
    container_name: monitoring-node-exporter
    image: prom/node-exporter:latest
    restart: unless-stopped

    ports:
      - "9100:9100"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    networks:
      - monitoring

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  prometheus:
    container_name: monitoring-prometheus
    image: prom/prometheus:v2.49.0
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

    networks:
      - monitoring

    depends_on:
      - node-exporter

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  loki:
    container_name: monitoring-loki
    image: grafana/loki:3.6.3
    restart: unless-stopped

    ports:
      - "3100:3100"

    volumes:
      - loki-storage:/loki/data
      - ../../runtime/monitoring/config/loki-config.yaml:/etc/loki/local-config.yaml:ro

    command: -config.file=/etc/loki/local-config.yaml

    networks:
      - monitoring

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  promtail:
    container_name: monitoring-promtail
    image: grafana/promtail:3.2.1
    restart: unless-stopped

    ports:
      - "9091:9091"

    volumes:
      - /var/log:/var/log
      - ../../runtime/monitoring/config/promtail.yml:/etc/promtail/config.yml

    command: -config.file=/etc/promtail/config.yml

    networks:
      - monitoring

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  grafana:
    container_name: monitoring-grafana
    image: grafana/grafana:latest
    restart: unless-stopped

    ports:
      - "3030:3000"

    env_file:
      - ../../runtime/monitoring/.env

    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_FEATURE_TOGGLES_ENABLE: alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode

    volumes:
      - grafana-storage:/var/lib/grafana
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./config/grafana/linux-monitoring.json:/var/lib/grafana/dashboards/linux-monitoring.json

    networks:
      - monitoring
      - private-net

    depends_on:
      - prometheus

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

volumes:
  grafana-storage:
  prometheus-storage:
  loki-storage:
