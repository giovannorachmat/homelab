networks:
  monitoring:
    external: true
  private-net:
    external: true

services:
  node-exporter:
    container_name: node-exporter-c
    image: prom/node-exporter:latest
    restart: unless-stopped

    ports:
      - "9100:9100"

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    networks:
      - monitoring

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  prometheus:
    container_name: prometheus-c
    image: prom/prometheus:v2.49.0
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-storage:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

    networks:
      - monitoring

    depends_on:
      - node-exporter

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M

  loki:
    container_name: loki-c
    image: grafana/loki:3.6.3
    restart: unless-stopped

    ports:
      - "3100:3100"

    command: -config.file=/etc/loki/local-config.yaml

    networks:
      - monitoring

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  promtail:
    container_name: promtail-c
    image: grafana/promtail:3.2.1
    restart: unless-stopped

    ports:
      - "9091:9091"

    volumes:
      - /var/log:/var/log
      - ../../runtime/monitoring/config/promtail.yml:/etc/promtail/config.yml
      - ../../runtime/airflow-docker/logs:/var/log/airflow:ro
      - ../../runtime/vault/logs:/var/log/vault:ro

    command: -config.file=/etc/promtail/config.yml

    networks:
      - monitoring

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

  grafana:
    container_name: grafana-c
    image: grafana/grafana:latest
    restart: unless-stopped

    ports:
      - "3030:3000"

    env_file:
      - ../../runtime/monitoring/.env

    environment:
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SERVER_ROOT_URL: https://grafana.giografi.my.id
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Authentik
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.giografi.my.id/application/o/authorize/
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://authentik-server:9000/application/o/token/
      GF_AUTH_GENERIC_OAUTH_API_URL: http://authentik-server:9000/application/o/userinfo/
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: alertingSimplifiedRouting,alertingQueryAndExpressionsStepMode

    volumes:
      - grafana-storage:/var/lib/grafana
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards/dashboard.yml
      - ./config/grafana/linux-monitoring.json:/var/lib/grafana/dashboards/linux-monitoring.json

    networks:
      - monitoring
      - private-net

    depends_on:
      - prometheus

    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

volumes:
  grafana-storage:
  prometheus-storage:
