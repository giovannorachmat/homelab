services:
  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - /usr/share/ollama/.ollama:/root/.ollama

    command: ["serve"]

    environment:
      OLLAMA_KEEP_ALIVE: "-1"

    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - private-net

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 2G

networks:
  private-net:
    external: true
